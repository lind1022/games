<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #1c1c1e;
        color: #eee;
      }
      h1 {
        font-size: 18px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 8px;
        color: #9ad0ff;
      }
      #login-view {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #login-box {
        background: #2a2a2c;
        border-radius: 8px;
        padding: 24px 28px;
        min-width: 260px;
      }
      #login-box input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        margin-top: 10px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #1c1c1e;
        color: #eee;
      }
      #login-box button,
      button {
        cursor: pointer;
        border: 1px solid #444;
        background: #333;
        color: #eee;
        border-radius: 4px;
        padding: 6px 12px;
        font-size: 13px;
      }
      button:hover {
        background: #444;
      }
      button.danger {
        border-color: #7a2a2a;
        background: #4a1f1f;
      }
      button.danger:hover {
        background: #632828;
      }
      #login-error {
        color: #ff8a8a;
        min-height: 1.2em;
        margin-top: 10px;
        font-size: 13px;
      }
      #dashboard {
        display: none;
        max-width: 960px;
        margin: 0 auto;
        padding: 20px;
      }
      #dashboard.visible {
        display: block;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      section {
        background: #2a2a2c;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #3a3a3c;
      }
      .row-actions {
        display: flex;
        gap: 6px;
      }
      .muted-tag {
        color: #ffd479;
      }
      .disabled-tag {
        color: #ff8a8a;
      }
      .flagged-tag {
        color: #ff8a8a;
        font-weight: bold;
      }
      .create-code-form,
      .rollback-form {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .create-code-form input,
      .rollback-form input {
        padding: 6px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #1c1c1e;
        color: #eee;
      }
      #new-code-banner {
        display: none;
        background: #1f3a1f;
        border: 1px solid #2f5a2f;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 12px;
        font-size: 14px;
      }
      #new-code-banner.visible {
        display: block;
      }
      .chat-filters {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 10px;
        font-size: 13px;
      }
      #rollback-result {
        font-size: 13px;
        margin-top: 6px;
        color: #9ad0ff;
      }
      small {
        color: #999;
      }
    </style>
  </head>
  <body>
    <div id="login-view">
      <div id="login-box">
        <h1>Admin login</h1>
        <input id="login-password" type="password" placeholder="Password" autofocus />
        <button id="login-submit" style="margin-top: 10px; width: 100%">Log in</button>
        <div id="login-error"></div>
      </div>
    </div>

    <div id="dashboard">
      <div class="topbar">
        <h1>School Game — Admin</h1>
        <button id="logout">Log out</button>
      </div>

      <section>
        <h2>Create a join code</h2>
        <div id="new-code-banner"></div>
        <div class="create-code-form">
          <input id="new-code-name" type="text" placeholder="Child's display name" />
          <button id="create-code">Create code</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Created</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="codes-table"></tbody>
        </table>
      </section>

      <section>
        <h2>Online now</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="players-table"></tbody>
        </table>
      </section>

      <section>
        <h2>Rollback a player's recent changes</h2>
        <div class="rollback-form">
          <input id="rollback-name" type="text" placeholder="Display name" />
          <input id="rollback-minutes" type="number" min="1" value="10" style="width: 70px" />
          <span>minutes</span>
          <button id="rollback-submit">Rollback</button>
        </div>
        <div id="rollback-result"></div>
      </section>

      <section>
        <h2>Chat log</h2>
        <div class="chat-filters">
          <label><input type="checkbox" id="chat-flagged-only" /> Flagged only</label>
          <input id="chat-player-filter" type="text" placeholder="Filter by player…" style="width: 160px" />
          <button id="chat-refresh">Refresh</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>When</th>
              <th>Player</th>
              <th>Message</th>
              <th>Flag</th>
            </tr>
          </thead>
          <tbody id="chat-table"></tbody>
        </table>
      </section>
    </div>

    <script>
      const loginView = document.getElementById('login-view');
      const dashboard = document.getElementById('dashboard');
      const loginError = document.getElementById('login-error');

      async function api(path, options) {
        const res = await fetch('/admin/api' + path, {
          ...options,
          headers: { 'content-type': 'application/json', ...(options && options.headers) },
          credentials: 'same-origin',
        });
        if (res.status === 401) {
          showLogin();
          throw new Error('unauthorized');
        }
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || `request failed (${res.status})`);
        return body;
      }

      function showLogin() {
        loginView.style.display = 'flex';
        dashboard.classList.remove('visible');
      }

      function showDashboard() {
        loginView.style.display = 'none';
        dashboard.classList.add('visible');
        refreshAll();
      }

      document.getElementById('login-submit').addEventListener('click', async () => {
        loginError.textContent = '';
        const password = document.getElementById('login-password').value;
        try {
          await api('/login', { method: 'POST', body: JSON.stringify({ password }) });
          showDashboard();
        } catch (err) {
          loginError.textContent = err.message;
        }
      });
      document.getElementById('login-password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('login-submit').click();
      });

      document.getElementById('logout').addEventListener('click', async () => {
        await api('/logout', { method: 'POST' }).catch(() => {});
        showLogin();
      });

      function fmtDate(ms) {
        return new Date(ms).toLocaleString();
      }

      async function refreshCodes() {
        const codes = await api('/codes');
        const tbody = document.getElementById('codes-table');
        tbody.innerHTML = '';
        for (const c of codes) {
          const tr = document.createElement('tr');
          const status = [];
          if (c.disabled) status.push('<span class="disabled-tag">revoked</span>');
          if (c.muted) status.push('<span class="muted-tag">muted</span>');
          if (status.length === 0) status.push('active');
          tr.innerHTML = `
            <td>${escapeHtml(c.displayName)}</td>
            <td><small>${fmtDate(c.createdAt)}</small></td>
            <td>${status.join(' · ')}</td>
            <td class="row-actions"></td>
          `;
          const actions = tr.querySelector('.row-actions');
          if (!c.disabled) {
            const muteBtn = document.createElement('button');
            muteBtn.textContent = c.muted ? 'Unmute' : 'Mute';
            muteBtn.onclick = async () => {
              await api(`/codes/${encodeURIComponent(c.codeHash)}/mute`, {
                method: 'POST',
                body: JSON.stringify({ muted: !c.muted }),
              });
              refreshCodes();
            };
            actions.appendChild(muteBtn);

            const reissueBtn = document.createElement('button');
            reissueBtn.textContent = 'Reissue';
            reissueBtn.onclick = async () => {
              if (
                !confirm(
                  `Reissue a new code for ${c.displayName}? Their current code will stop working immediately.`
                )
              )
                return;
              const result = await api(`/codes/${encodeURIComponent(c.codeHash)}/reissue`, { method: 'POST' });
              showNewCodeBanner(result.displayName, result.code);
              refreshCodes();
            };
            actions.appendChild(reissueBtn);

            const revokeBtn = document.createElement('button');
            revokeBtn.textContent = 'Revoke';
            revokeBtn.className = 'danger';
            revokeBtn.onclick = async () => {
              if (!confirm(`Revoke ${c.displayName}'s code? This cannot be undone.`)) return;
              await api(`/codes/${encodeURIComponent(c.codeHash)}/revoke`, { method: 'POST' });
              refreshCodes();
            };
            actions.appendChild(revokeBtn);
          }
          tbody.appendChild(tr);
        }
      }

      async function refreshPlayers() {
        const players = await api('/players');
        const tbody = document.getElementById('players-table');
        tbody.innerHTML = '';
        for (const p of players) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${escapeHtml(p.name)}</td><td class="row-actions"></td>`;
          const kickBtn = document.createElement('button');
          kickBtn.textContent = 'Kick';
          kickBtn.className = 'danger';
          kickBtn.onclick = async () => {
            await api(`/players/${encodeURIComponent(p.id)}/kick`, { method: 'POST' });
            refreshPlayers();
          };
          tr.querySelector('.row-actions').appendChild(kickBtn);
          tbody.appendChild(tr);
        }
        if (players.length === 0) {
          tbody.innerHTML = '<tr><td colspan="2"><small>Nobody online.</small></td></tr>';
        }
      }

      async function refreshChatLog() {
        const flaggedOnly = document.getElementById('chat-flagged-only').checked;
        const player = document.getElementById('chat-player-filter').value.trim();
        const params = new URLSearchParams();
        if (flaggedOnly) params.set('flagged', '1');
        if (player) params.set('player', player);
        params.set('limit', '500');
        const rows = await api('/chat-log?' + params.toString());
        const tbody = document.getElementById('chat-table');
        tbody.innerHTML = '';
        for (const r of rows) {
          const tr = document.createElement('tr');
          const flagCell = r.flagged ? `<span class="flagged-tag">${escapeHtml(r.flagReason || 'flagged')}</span>` : '';
          tr.innerHTML = `
            <td><small>${fmtDate(r.ts)}</small></td>
            <td>${escapeHtml(r.displayName)}</td>
            <td>${escapeHtml(r.message)}</td>
            <td>${flagCell}</td>
          `;
          tbody.appendChild(tr);
        }
      }

      function showNewCodeBanner(displayName, code) {
        const banner = document.getElementById('new-code-banner');
        banner.textContent = `Code for ${displayName}: ${code} — shown once, write it down.`;
        banner.classList.add('visible');
      }

      document.getElementById('create-code').addEventListener('click', async () => {
        const nameInput = document.getElementById('new-code-name');
        const name = nameInput.value.trim();
        if (!name) return;
        const result = await api('/codes', { method: 'POST', body: JSON.stringify({ displayName: name }) });
        showNewCodeBanner(result.displayName, result.code);
        nameInput.value = '';
        refreshCodes();
      });

      document.getElementById('rollback-submit').addEventListener('click', async () => {
        const displayName = document.getElementById('rollback-name').value.trim();
        const minutes = Number(document.getElementById('rollback-minutes').value);
        if (!displayName || !minutes) return;
        const result = await api('/rollback', { method: 'POST', body: JSON.stringify({ displayName, minutes }) });
        document.getElementById('rollback-result').textContent = `Restored ${result.restored} block(s).`;
      });

      document.getElementById('chat-refresh').addEventListener('click', refreshChatLog);
      document.getElementById('chat-flagged-only').addEventListener('change', refreshChatLog);

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function refreshAll() {
        refreshCodes();
        refreshPlayers();
        refreshChatLog();
      }

      let pollHandle = null;
      function startPolling() {
        if (pollHandle) return;
        pollHandle = setInterval(() => {
          if (dashboard.classList.contains('visible')) refreshPlayers();
        }, 3000);
      }

      (async () => {
        try {
          const session = await fetch('/admin/api/session', { credentials: 'same-origin' }).then((r) => r.json());
          if (session.authenticated) showDashboard();
          else showLogin();
        } catch {
          showLogin();
        }
        startPolling();
      })();
    </script>
  </body>
</html>
